<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img" aria-label="En Escala Arquitectura">
  <!-- E 3D isométrica -->
  <!-- Cara frontal (verde lima) -->
  <polygon points="8,12 38,12 38,20 16,20 16,34 34,34 34,42 16,42 16,56 38,56 38,64 8,64" fill="#8DC21F"/>
  <!-- Cara superior (gris medio) -->
  <polygon points="8,12 14,6 44,6 38,12" fill="#6E6E6E"/>
  <polygon points="38,12 44,6 44,14 38,20" fill="#5A5A5A"/>
  <!-- Cara superior barra media -->
  <polygon points="16,34 22,28 40,28 34,34" fill="#6E6E6E"/>
  <polygon points="34,34 40,28 40,36 34,42" fill="#5A5A5A"/>
  <!-- Cara lateral derecha general -->
  <polygon points="38,12 44,6 44,70 38,64" fill="#4A4A4A"/>
  <!-- Barra inferior cara superior -->
  <polygon points="16,56 22,50 44,50 38,56" fill="#6E6E6E"/>
  <polygon points="38,56 44,50 44,70 38,64" fill="#3D3D3D"/>
  <!-- Cara top barra superior -->
  <polygon points="38,20 44,14 44,22 38,26" fill="#5A5A5A"/>
  <polygon points="16,20 22,14 44,14 38,20" fill="#7A7A7A"/>
  <polygon points="16,42 22,36 44,36 34,42 16,42" fill="#6E6E6E"/>

  <!-- Texto ENESCALA -->
  <text x="58" y="38" font-family="'Montserrat', 'Arial', sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#2B2B2B">ENESCALA</text>
  <!-- Texto ARQUITECTURA -->
  <text x="60" y="56" font-family="'Montserrat', 'Arial', sans-serif" font-weight="400" font-size="10" letter-spacing="6" fill="#6E6E6E">ARQUITECTURA</text>
</svg>
